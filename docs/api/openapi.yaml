openapi: 3.0.3
info:
  title: TeachAI Backend API
  version: 1.0.0
  description: |
    Comprehensive API documentation for TeachAI educational platform backend services.
    
    ## Features
    - JWT-based authentication
    - AI-powered chat conversations  
    - User profile management
    - Educational content management
    - Payment processing with Stripe
    - Administrative functions
    
    ## Rate Limits
    - Authentication: 5 req/min per IP
    - Chat: 60 req/hour per user
    - General: 1000 req/hour per user
    
    ## Support
    For technical support, contact: support@teachai.com
    
  contact:
    name: TeachAI Support
    email: support@teachai.com
    url: https://teachai.com/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://teachai.com/terms

servers:
  - url: http://localhost:5000/api
    description: Development server
  - url: https://staging-api.teachai.com
    description: Staging server
  - url: https://api.teachai.com
    description: Production server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    User:
      type: object
      required: [name, email, role]
      properties:
        _id:
          type: string
          description: Unique user identifier
          example: "64a1b2c3d4e5f6789012345"
        name:
          type: string
          description: Full name of the user
          example: "John Doe"
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          description: User email address (unique)
          example: "john.doe@example.com"
        role:
          type: string
          enum: [student, teacher, admin]
          description: User role for permissions
          example: "student"
        avatar:
          type: string
          format: uri
          description: Profile picture URL
          example: "https://example.com/avatar.jpg"
        bio:
          type: string
          description: User biography
          example: "Passionate educator"
          maxLength: 500
        isVerified:
          type: boolean
          description: Email verification status
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T08:30:00Z"
        lastLogin:
          type: string
          format: date-time
          example: "2024-01-20T14:45:00Z"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
              description: JWT authentication token
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        message:
          type: string
          example: "Authentication successful"

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        _id:
          type: string
          example: "64a1b2c3d4e5f6789012346"
        role:
          type: string
          enum: [user, assistant, system]
          example: "user"
        content:
          type: string
          description: Message text content
          example: "What is photosynthesis?"
          maxLength: 4000
        timestamp:
          type: string
          format: date-time
          example: "2024-01-20T15:30:00Z"
        metadata:
          type: object
          properties:
            subject:
              type: string
              example: "biology"
            grade:
              type: string
              example: "10"
            responseTime:
              type: number
              example: 1.5

    Conversation:
      type: object
      properties:
        _id:
          type: string
          example: "64a1b2c3d4e5f6789012347"
        conversationId:
          type: string
          description: Human-readable conversation ID
          example: "conv-biology-photosynthesis-123"
        userId:
          type: string
          description: Conversation owner
          example: "64a1b2c3d4e5f6789012345"
        title:
          type: string
          description: Auto-generated or custom title
          example: "Biology: Photosynthesis Discussion"
          maxLength: 200
        subject:
          type: string
          example: "biology"
        grade:
          type: string
          example: "10"
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        messageCount:
          type: integer
          description: Total number of messages
          example: 8
        lastMessage:
          type: string
          description: Preview of last message
          example: "That's a great explanation!"
        lastActivity:
          type: string
          format: date-time
          example: "2024-01-20T15:30:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-20T15:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-20T15:45:00Z"
        isActive:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Human-readable error message
          example: "Invalid credentials provided"
        error:
          type: string
          description: Error code
          example: "INVALID_CREDENTIALS"
        details:
          type: object
          description: Additional error details
        timestamp:
          type: string
          format: date-time
          example: "2024-01-20T15:30:00Z"
        requestId:
          type: string
          description: Unique request identifier
          example: "req_64a1b2c3d4e5f6789012348"

    PaginationMeta:
      type: object
      properties:
        currentPage:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 5
        totalItems:
          type: integer
          example: 47
        itemsPerPage:
          type: integer
          example: 10
        hasNextPage:
          type: boolean
          example: true
        hasPrevPage:
          type: boolean
          example: false

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (starts from 1)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    LimitParam:
      name: limit
      in: query
      description: Items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10

    SortParam:
      name: sort
      in: query
      description: Sort field and direction
      required: false
      schema:
        type: string
        example: "createdAt:desc"

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Authentication token required"
            error: "UNAUTHORIZED"

    ForbiddenError:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Insufficient permissions"
            error: "FORBIDDEN"

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Resource not found"
            error: "NOT_FOUND"

    ValidationError:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Validation failed"
            error: "VALIDATION_ERROR"
            details:
              email: "Valid email required"
              password: "Minimum 8 characters"

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: Create a new user account with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: "John Doe"
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  example: "securePassword123"
                  minLength: 8
                role:
                  type: string
                  enum: [student, teacher]
                  default: "student"
                  example: "student"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  example: "securePassword123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/profile:
    get:
      tags: [Users]
      summary: Get user profile
      description: Retrieve current user profile information
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    
    put:
      tags: [Users]
      summary: Update user profile
      description: Update current user profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Jane Smith"
                bio:
                  type: string
                  example: "Updated bio"
                avatar:
                  type: string
                  format: uri
                  example: "https://example.com/avatar.jpg"
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: "Profile updated successfully"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /chat/send:
    post:
      tags: [Chat]
      summary: Send chat message
      description: Send message to AI and receive response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "What is photosynthesis?"
                  maxLength: 4000
                subject:
                  type: string
                  example: "biology"
                grade:
                  type: string
                  example: "10"
                conversationId:
                  type: string
                  description: Continue existing conversation
                  example: "conv-biology-123"
      responses:
        '200':
          description: Message sent and response received
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      response:
                        type: string
                        example: "Photosynthesis is the process..."
                      conversationId:
                        type: string
                        example: "conv-biology-123"
                      messageId:
                        type: string
                        example: "msg-456"
                      timestamp:
                        type: string
                        format: date-time
                      metadata:
                        type: object
                        properties:
                          subject:
                            type: string
                          grade:
                            type: string
                          responseTime:
                            type: number
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chat/history:
    get:
      tags: [Chat]
      summary: Get chat history
      description: Retrieve user's conversation history with pagination
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: subject
          in: query
          description: Filter by subject
          required: false
          schema:
            type: string
            example: "biology"
        - name: search
          in: query
          description: Search in conversation titles
          required: false
          schema:
            type: string
            example: "photosynthesis"
      responses:
        '200':
          description: Chat history retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      conversations:
                        type: array
                        items:
                          $ref: '#/components/schemas/Conversation'
                      pagination:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /chat/conversation/{conversationId}:
    get:
      tags: [Chat]
      summary: Get conversation details
      description: Retrieve specific conversation with full message history
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation identifier
          schema:
            type: string
            example: "conv-biology-123"
      responses:
        '200':
          description: Conversation retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      conversation:
                        $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Chat]
      summary: Delete conversation
      description: Delete conversation and all its messages
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation identifier
          schema:
            type: string
            example: "conv-biology-123"
      responses:
        '200':
          description: Conversation deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Conversation deleted successfully"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Users
    description: User profile management
  - name: Chat
    description: AI-powered chat conversations
  - name: Posts
    description: Educational content management
  - name: Comments
    description: Discussion and feedback system
  - name: Orders
    description: Subscription management
  - name: Payments
    description: Payment processing
  - name: Admin
    description: Administrative functions