# pytest Configuration for TeachAI Flask AI Services
[tool:pytest]
# Test discovery patterns
testpaths = tests flaskApi/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test output configuration
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=flaskApi
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=70
    --cov-branch
    --durations=10
    --color=yes

# Minimum version requirement
minversion = 6.0

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run
    ai_service: Tests that interact with AI services
    requires_internet: Tests that require internet connection
    smoke: Smoke tests for basic functionality
    regression: Regression tests

# Filters for warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*requests.*:urllib3.exceptions.InsecureRequestWarning

# Test timeout (in seconds)
timeout = 300
timeout_method = thread

# Coverage configuration
[coverage:run]
source = flaskApi
omit = 
    */tests/*
    */test_*
    */conftest.py
    */venv/*
    */env/*
    */.env/*
    */migrations/*
    */alembic/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# Coverage HTML output
[coverage:html]
directory = htmlcov
title = TeachAI Flask API Coverage Report

# Coverage XML output
[coverage:xml]
output = coverage.xml